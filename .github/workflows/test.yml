name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  voice:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fail agent-ops language
        run: bash scripts/check-public-voice.sh

  test:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SociACL contract against pinned upstream
        run: node scripts/check-sociacl-contract.mjs --upstream

      - name: Check scheduled experiment harness
        run: node --check scripts/test-experiment-browser.mjs && node --test scripts/experiment-browser-fixture.test.mjs scripts/experiment-expiry-probes.test.mjs

      - name: Verify pairing owner artifacts
        run: node scripts/check-pairing-packages.mjs && node --check scripts/test-device-transfer.mjs && node --check scripts/device-transfer-scenario.mjs && node --test scripts/device-transfer-scenario.test.mjs

      - name: Fetch public synthetic owner vectors for isolated contracts
        run: node scripts/fetch-pairing-vectors.mjs

      - name: Run tests
        run: npm test

      - name: Native linked OIDC proof consumer coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/linked-oidc-proof-server.ts
          lib/identity/linked-oidc-proof-server.test.ts
      - name: Native linked credential authority coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/acl-credential-source-server.ts
          --test-coverage-include=lib/identity/linked-admission-config-server.ts
          lib/identity/acl-credential-source-server.test.ts
          lib/identity/linked-admission-config-server.test.ts
          lib/identity/linked-session-admission.test.ts
          lib/identity/linked-wallet-client.test.ts
      - name: Native linked OIDC browser flow coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/linked-oidc-browser-flow.ts
          --test-coverage-include=lib/identity/linked-oidc-config-server.ts
          lib/identity/linked-oidc-browser-flow.test.ts
          lib/identity/linked-oidc-config-server.test.ts
      - name: Terminal admission unit coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-run.ts
          --test-coverage-lines=90 --test-coverage-branches=90
          lib/identity/terminal-run.test.ts lib/experiment-outbox-terminal.test.ts

      - name: Terminal owner configuration unit coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-owner-config.ts
          --test-coverage-lines=95 --test-coverage-branches=90
          lib/identity/terminal-owner-config.test.ts

      - name: Native terminal owner control coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-owner-control.ts
          lib/identity/terminal-owner-control.test.ts

      - name: Native terminal startup composition coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-startup-route.ts
          lib/identity/terminal-startup-route.test.ts

      - name: Terminal fixture policy coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-fixture-policy.ts
          --test-coverage-lines=95 --test-coverage-branches=90
          lib/identity/terminal-fixture-policy.test.ts

      - name: Native terminal serving router coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-serving-router.ts
          lib/identity/terminal-serving-router.test.ts

      - name: Native terminal device composition coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-device-route.ts
          lib/identity/terminal-device-route.test.ts

      - name: Native terminal SEA composition coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-sea-route.ts
          --test-coverage-include=lib/identity/sea-session-client.ts
          lib/identity/terminal-sea-route.test.ts lib/identity/sea-session-client.test.ts

      - name: Native terminal experiment composition coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/terminal-experiment-route.ts
          lib/identity/terminal-experiment-route.test.ts

      - name: Install isolated browser for media contracts
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Local ciphertext cache browser contracts (CI only)
        timeout-minutes: 2
        run: node scripts/test-ipfs-cache-browser.mjs

      - name: Direct Kubo browser contract (CI only)
        run: node scripts/test-ipfs-kubo-browser.mjs
      - name: Public media browser contracts (CI only)
        run: node scripts/test-public-media-browser.mjs
      - name: Private upload browser recovery contract (CI only)
        run: node scripts/test-private-upload-browser.mjs
      - name: Captioned PNG private upload contract (CI only)
        run: S3RCH_UPLOAD_FIXTURE=meme node scripts/test-private-upload-browser.mjs
      - name: Recorded audio and video private upload contracts (CI only)
        run: |
          S3RCH_UPLOAD_FIXTURE=audio node scripts/test-private-upload-browser.mjs
          S3RCH_UPLOAD_FIXTURE=video node scripts/test-private-upload-browser.mjs
      - name: Private room audio and video browser contracts (CI only)
        run: |
          S3RCH_ROOM_MEDIA_FIXTURE=audio node scripts/test-room-media-browser.mjs
          S3RCH_ROOM_MEDIA_FIXTURE=video node scripts/test-room-media-browser.mjs
      - name: Check scheduled contact inbox source
        run: node --check scripts/test-contact-inbox.mjs
      - name: Room task browser contracts (CI only)
        run: node scripts/test-room-tasks.mjs
      - name: Recording browser contracts (CI only)
        run: node scripts/test-media-recorder.mjs
      - name: Group wrap browser client coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/media-group-wrap-client.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-wrap-client.test.ts
      - name: Group wrap transport coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/media-group-wrap.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-wrap.test.ts lib/media-group-service.test.ts
      - name: Recording draft coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/media-recorder.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-recorder.test.ts
      - name: Image draft browser contracts (CI only)
        run: node scripts/test-meme-editor.mjs
      - name: Image draft coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/meme-image.ts
          --test-coverage-include=lib/meme-png-tags.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/meme-image.test.ts lib/meme-png-tags.test.ts

      - name: Nostr source and bounded relay coverage
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/nostr.ts
          --test-coverage-include=lib/nostr-filter.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/nostr.test.ts lib/nostr-window.test.ts lib/nostr-filter.test.ts

      - name: Native forum statement browser contract (CI only)
        run: node --import tsx scripts/test-forum-statement-browser.ts
      - name: Native forum browser statement coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/forum-statement-browser.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/forum-statement-browser.test.ts lib/squad-browser-source.test.ts

      - name: Nostr signature browser contracts (CI only)
        run: node scripts/test-nostr-signatures.mjs
      - name: Public live directory browser contracts (CI only)
        run: node scripts/test-live-directory.mjs
      - name: Public live source coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/nostr-live.ts
          --test-coverage-include=lib/nostr-event.ts
          --test-coverage-include=lib/public-media-sources.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/nostr-live.test.ts lib/nostr-event.test.ts lib/public-media-sources.test.ts

      - name: Provider conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts
      - name: ActivityPub conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts --activitypub
      - name: Nostr conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts --nostr
      - name: Farcaster conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts --farcaster
      - name: Public provider conversation coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/atproto-conversation.ts
          --test-coverage-include=lib/activitypub-conversation.ts
          --test-coverage-include=lib/nostr-conversation.ts
          --test-coverage-include=lib/farcaster-conversation.ts
          --test-coverage-include=lib/public-conversation.ts
          --test-coverage-include=lib/conversation-media.ts
          --test-coverage-include=lib/conversation-media-tickets.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/atproto-conversation.test.ts lib/activitypub-conversation.test.ts lib/nostr-conversation.test.ts lib/farcaster-conversation.test.ts lib/public-conversation.test.ts lib/conversation-media.test.ts

      - name: Feed reply and cached conversation coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/feed-reply.ts
          --test-coverage-include=lib/feed-conversation.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/feed-reply.test.ts lib/feed-conversation.test.ts

      - name: Public media proxy and player coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/public-media-proxy.ts
          --test-coverage-include=lib/public-media-player.ts
          --test-coverage-include=lib/public-media-admission.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/public-media-proxy.test.ts lib/public-media-player.test.ts lib/public-media-admission.test.ts

      - name: Public feed media metadata coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/feed-media.ts
          --test-coverage-include=lib/feed-media-adapters.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/feed-media-adapters.test.ts

      - name: Media crypto buffer cleanup coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/media-crypto.ts
          --test-coverage-lines=95 --test-coverage-branches=90
          lib/media-crypto.test.ts
      - name: Private media consumer contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-wrap-service.ts
          --test-coverage-include=lib/media-wrap-client.ts
          --test-coverage-include=lib/media-group-item-client.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          --test-coverage-include=lib/media-group-recovery.ts
          --test-coverage-include=lib/media-group-member.ts
          --test-coverage-include=lib/media-group-consent.ts
          --test-coverage-include=lib/media-reader-catalog.ts
          lib/media-group-recovery.test.ts lib/media-group-member.test.ts lib/media-group-consent.test.ts lib/media-reader-catalog.test.ts lib/media-wrap-server.test.ts lib/media-wrap-client.test.ts lib/media-share-recovery.test.ts

      - name: Allocated media payload contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/allocated-media-store-server.ts
          --test-coverage-include=lib/allocated-media-service.ts
          --test-coverage-include=lib/media-object-service.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/allocated-media-store-server.test.ts lib/allocated-media-service.test.ts lib/media-object-service.test.ts
      - name: Granted media browser contract (CI only)
        run: |
          node scripts/test-granted-media-browser.mjs
          S3RCH_GRANTED_FIXTURE=audio node scripts/test-granted-media-browser.mjs
          S3RCH_GRANTED_FIXTURE=video node scripts/test-granted-media-browser.mjs
      - name: Existing keyring restore component contract (CI only)
        run: node scripts/test-keyring-restore-ui.mjs
      - name: Existing keyring restore native coverage (CI only)
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/identity/restore-keyring.ts
          --test-coverage-include=lib/identity/restored-keyring-storage.ts
          --test-coverage-lines=95 --test-coverage-branches=75
          lib/identity/restore-keyring.test.ts
      - name: Wallet key creation and public export browser contract (CI only)
        run: node scripts/test-wallet-key-browser.mjs
      - name: Private sharing browser recovery contract (CI only)
        run: node scripts/test-private-sharing-browser.mjs
      - name: Group item grant contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-grant.ts
          --test-coverage-include=lib/media-group-item-grant-client.ts
          --test-coverage-include=lib/media-group-item-grant-recovery.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-grant.test.ts lib/media-group-item-grant-client.test.ts
      - name: Group item epoch signing and recovery coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-epoch.ts
          --test-coverage-include=lib/media-group-item-epoch-signing.ts
          --test-coverage-include=lib/media-group-item-epoch-command.ts
          --test-coverage-include=lib/media-group-item-epoch-client.ts
          --test-coverage-include=lib/media-group-item-epoch-recovery.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-epoch.test.ts lib/media-group-item-epoch-signing.test.ts
          lib/media-group-item-epoch-command.test.ts lib/media-group-item-epoch-client.test.ts
      - name: Group epoch replacement wrap recovery coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-epoch-delivery.ts
          --test-coverage-include=lib/media-group-owner-wrap.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-epoch-delivery.test.ts lib/media-group-owner-wrap.test.ts
      - name: Group item wrapped-key recovery coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-wrap-recovery.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-wrap-recovery.test.ts
      - name: Group item wrapped-key publication coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-wrap-client.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-wrap-client.test.ts
      - name: Group Granted catalog coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-catalog.ts
          --test-coverage-include=lib/media-group-item-catalog-client.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-catalog.test.ts lib/media-group-item-catalog-client.test.ts
      - name: Group file opening coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-file.ts
          --test-coverage-include=lib/media-ciphertext-authorization.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-file.test.ts lib/allocated-media-service.test.ts
      - name: Group item key opening coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-reader.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-reader.test.ts
      - name: Group item wrap shape coverage
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-wrap.ts
          --test-coverage-lines=95 --test-coverage-branches=90
          lib/media-group-item-wrap.test.ts
      - name: Group item status signing and recovery coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-item-status.ts
          --test-coverage-include=lib/media-group-item-status-client.ts
          --test-coverage-include=lib/media-group-item-status-recovery.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-item-status.test.ts lib/media-group-item-status-client.test.ts
      - name: Independent group command contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-group-key-recovery.ts
          --test-coverage-include=lib/media-group-key-client.ts
          --test-coverage-include=lib/media-group-key.ts
          --test-coverage-include=lib/media-group-command.ts
          --test-coverage-include=lib/media-group-service.ts
          --test-coverage-include=lib/media-group-client.ts
          --test-coverage-include=lib/media-group-command-recovery.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group-key-recovery.test.ts lib/media-group-key-client.test.ts lib/media-group-key.test.ts lib/media-group-service.test.ts lib/media-group-item.test.ts lib/media-group-client.test.ts lib/media-group-command-recovery.test.ts
      - name: Private media owner contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-owner-service.ts
          --test-coverage-include=lib/media-owner-client.ts
          --test-coverage-include=lib/media-share.ts
          --test-coverage-include=lib/media-group.ts
          --test-coverage-include=lib/media-group-signing.ts
          --test-coverage-include=lib/media-deletion.ts
          --test-coverage-include=lib/media-catalog.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-group.test.ts lib/media-group-signing.test.ts lib/media-owner-service.test.ts lib/media-owner-client.test.ts lib/media-deletion.test.ts lib/media-catalog.test.ts lib/media-upload.test.ts lib/media-share-recovery.test.ts
      - name: Private sharing recovery contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-share-recovery.ts
          --test-coverage-include=lib/media-share-journal.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-share-recovery.test.ts
      - name: Unlocked media identity contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-browser-session.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-browser-session.test.ts
      - name: Encrypted upload recovery and UI coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-upload.ts
          --test-coverage-include=lib/media-upload-journal.ts
          --test-coverage-include=lib/media-upload-panel.ts
          --test-coverage-include=lib/media-tags.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-upload.test.ts lib/media-upload-panel.test.ts
      - name: Private media library state and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-library.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-library.test.ts
      - name: Trusted source coverage
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/acl-statement-source-server.ts
          --test-coverage-include=lib/acl-graph-source-server.ts
          --test-coverage-include=lib/squad-pilot-server.ts
          lib/acl-statement-source-server.test.ts lib/squad-acl-source.test.ts
          lib/squad-pilot-config.test.ts lib/forum-authority-service.test.ts lib/squad-http-services.test.ts

      - name: Delegation consumer coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/identity/acl-delegation-source-server.ts
          --test-coverage-lines=95 --test-coverage-branches=80
          lib/identity/acl-delegation-source-server.test.ts

      - name: Native agent route coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/identity/agent-session-config.ts
          --test-coverage-include=lib/identity/site-agent-session-server.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/identity/agent-session-config.test.ts lib/identity/site-agent-session-server.test.ts
      - name: Legacy forum credential retirement coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=app/api/forum/route.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/forum-route.test.ts

  build:
    # Compile the production bundle; runtime acceptance runs in Infra nightly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Built Next terminal entry contracts (CI only)
        run: node --import tsx scripts/test-terminal-serving.ts

      - name: Verify public feed stays static until identity opt-in
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/test-static-feed.mjs

  image:
    # Builds the release Dockerfile and boots it with no Panopticon settings.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: s3rch:ci
          build-args: |
            VERSION=ci
            SOURCE_REVISION=${{ github.sha }}

      - name: Check the static frontend inside the image
        run: docker run --rm -i --network none --entrypoint node s3rch:ci --input-type=module < scripts/check-edge-payload.mjs

      - name: Boot image without Panopticon
        run: bash scripts/smoke-image.sh s3rch:ci
