name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  voice:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fail agent-ops language
        run: bash scripts/check-public-voice.sh

  test:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build:
    # Builds and starts the site with no Panopticon or identity storage
    # settings, so those integrations stay optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Start without optional integrations
        run: bash scripts/smoke-standalone.sh
