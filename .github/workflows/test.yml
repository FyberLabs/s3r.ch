name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  voice:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fail agent-ops language
        run: bash scripts/check-public-voice.sh

  test:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SociACL contract against pinned upstream
        run: node scripts/check-sociacl-contract.mjs --upstream

      - name: Check scheduled experiment harness
        run: node --check scripts/test-experiment-browser.mjs && node --test scripts/experiment-browser-fixture.test.mjs scripts/experiment-expiry-probes.test.mjs

      - name: Run tests
        run: npm test

      - name: Install isolated browser for media contracts
        run: |
          npx playwright-core install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Public media browser contracts (CI only)
        run: node scripts/test-public-media-browser.mjs
      - name: Room task browser contracts (CI only)
        run: node scripts/test-room-tasks.mjs
      - name: Recording browser contracts (CI only)
        run: node scripts/test-media-recorder.mjs
      - name: Recording draft coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/media-recorder.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-recorder.test.ts
      - name: Image draft browser contracts (CI only)
        run: node scripts/test-meme-editor.mjs
      - name: Image draft coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/meme-image.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/meme-image.test.ts

      - name: Nostr source and bounded relay coverage
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/nostr.ts
          --test-coverage-include=lib/nostr-filter.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/nostr.test.ts lib/nostr-window.test.ts lib/nostr-filter.test.ts

      - name: Nostr signature browser contracts (CI only)
        run: node scripts/test-nostr-signatures.mjs
      - name: Public live directory browser contracts (CI only)
        run: node scripts/test-live-directory.mjs
      - name: Public live source coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/nostr-live.ts
          --test-coverage-include=lib/nostr-event.ts
          --test-coverage-include=lib/public-media-sources.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/nostr-live.test.ts lib/nostr-event.test.ts lib/public-media-sources.test.ts

      - name: Provider conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts
      - name: ActivityPub conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts --activitypub
      - name: Nostr conversation browser contracts (CI only)
        run: node --import tsx scripts/test-provider-conversation.ts --nostr
      - name: Public provider conversation coverage
        run: >-
          node --import tsx --test --experimental-test-coverage
          --test-coverage-include=lib/atproto-conversation.ts
          --test-coverage-include=lib/activitypub-conversation.ts
          --test-coverage-include=lib/nostr-conversation.ts
          --test-coverage-include=lib/public-conversation.ts
          --test-coverage-include=lib/conversation-media.ts
          --test-coverage-include=lib/conversation-media-tickets.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/atproto-conversation.test.ts lib/activitypub-conversation.test.ts lib/nostr-conversation.test.ts lib/public-conversation.test.ts lib/conversation-media.test.ts

      - name: Feed reply and cached conversation coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/feed-reply.ts
          --test-coverage-include=lib/feed-conversation.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/feed-reply.test.ts lib/feed-conversation.test.ts

      - name: Public media proxy and player coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/public-media-proxy.ts
          --test-coverage-include=lib/public-media-player.ts
          --test-coverage-include=lib/public-media-admission.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/public-media-proxy.test.ts lib/public-media-player.test.ts lib/public-media-admission.test.ts

      - name: Public feed media metadata coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/feed-media.ts
          --test-coverage-include=lib/feed-media-adapters.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/feed-media-adapters.test.ts

      - name: Private media consumer contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-wrap-service.ts
          --test-coverage-include=lib/media-wrap-client.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-wrap-server.test.ts lib/media-wrap-client.test.ts

      - name: Private media owner contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-owner-service.ts
          --test-coverage-include=lib/media-owner-client.ts
          --test-coverage-include=lib/media-catalog.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-owner-service.test.ts lib/media-owner-client.test.ts lib/media-catalog.test.ts
      - name: Unlocked media identity contracts and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-browser-session.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-browser-session.test.ts
      - name: Private media library state and coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/media-library.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/media-library.test.ts
      - name: Trusted source coverage
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/acl-statement-source-server.ts
          --test-coverage-include=lib/acl-graph-source-server.ts
          --test-coverage-include=lib/squad-pilot-server.ts
          lib/acl-statement-source-server.test.ts lib/squad-acl-source.test.ts
          lib/squad-pilot-config.test.ts lib/forum-authority-service.test.ts lib/squad-http-services.test.ts

      - name: Delegation consumer coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/identity/acl-delegation-source-server.ts
          --test-coverage-lines=95 --test-coverage-branches=80
          lib/identity/acl-delegation-source-server.test.ts

      - name: Native agent route coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=lib/identity/agent-session-config.ts
          --test-coverage-include=lib/identity/site-agent-session-server.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/identity/agent-session-config.test.ts lib/identity/site-agent-session-server.test.ts
      - name: Legacy forum credential retirement coverage (CI only)
        run: >-
          node --import tsx --test --test-isolation=none --experimental-test-coverage
          --test-coverage-include=app/api/forum/route.ts
          --test-coverage-lines=90 --test-coverage-branches=80
          lib/forum-route.test.ts

  build:
    # Compile the production bundle; runtime acceptance runs in Infra nightly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  image:
    # Builds the release Dockerfile and boots it with no Panopticon settings.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: s3rch:ci
          build-args: |
            VERSION=ci
            SOURCE_REVISION=${{ github.sha }}

      - name: Check the static frontend inside the image
        run: docker run --rm -i --network none --entrypoint node s3rch:ci --input-type=module < scripts/check-edge-payload.mjs

      - name: Boot image without Panopticon
        run: bash scripts/smoke-image.sh s3rch:ci
