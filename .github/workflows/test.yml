name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  voice:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
      - name: Fail agent-ops language
        run: bash scripts/check-public-voice.sh

  test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
