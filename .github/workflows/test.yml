name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  voice:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fail agent-ops language
        run: bash scripts/check-public-voice.sh

  test:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Synthetic Squad multi-client recovery acceptance
        run: node scripts/test-assignment-acceptance.mjs

  build:
    # Builds and starts the site with no Panopticon or identity storage
    # settings, so those integrations stay optional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Check static public feed in Chromium
        run: |
          npx playwright-core install --with-deps chromium
          node scripts/test-static-feed.mjs

      - name: Verify Gun seed handoff and rollback
        run: node scripts/test-seed-handoff.mjs

      - name: Verify wallet sign-in and Squad challenge through the public proxy contract
        run: bash scripts/test-proxied-sign-in.sh

      - name: Start without optional integrations
        run: bash scripts/smoke-standalone.sh

  image:
    # Builds the release Dockerfile and boots it with no Panopticon settings.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          sbom: false
          tags: s3rch:ci
          build-args: |
            VERSION=ci
            SOURCE_REVISION=${{ github.sha }}

      - name: Check the static frontend inside the image
        run: docker run --rm -i --network none --entrypoint node s3rch:ci --input-type=module < scripts/check-edge-payload.mjs

      - name: Boot image without Panopticon
        run: bash scripts/smoke-image.sh s3rch:ci

  cancellation-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Exercise conditional writes and restart recovery in Azurite
        run: bash scripts/test-delegation-blob.sh
