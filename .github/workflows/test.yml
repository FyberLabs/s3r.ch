name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  voice:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fail agent-ops language
        run: bash scripts/check-public-voice.sh

  test:
    # pull_request runs fork code. Keep this off the org self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
