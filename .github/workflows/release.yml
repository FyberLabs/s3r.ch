name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-publish
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: release
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - name: Checkout trusted release logic
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Require release revision on default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/require-release-gates.mjs
      - uses: ./.github/actions/setup-gh
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the exact successful test artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-channels.mjs promote

      - name: Mint infra static dispatch token
        id: static-dispatch
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.S3RCH_STATIC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.S3RCH_STATIC_DISPATCH_APP_PRIVATE_KEY }}
          owner: FyberLabs
          repositories: infra
          permission-actions: write
      - name: Publish the production static frontend
        env:
          GH_TOKEN: ${{ steps.static-dispatch.outputs.token }}
          DISPATCH_TAG: ${{ github.ref_name }}
          DISPATCH_RUN_ID: ${{ github.run_id }}
        run: node scripts/dispatch-static-publish.mjs release
      - name: Mint a fresh token for TEST reconciliation
        id: static-reconcile
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.S3RCH_STATIC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.S3RCH_STATIC_DISPATCH_APP_PRIVATE_KEY }}
          owner: FyberLabs
          repositories: infra
          permission-actions: write
      - name: Publish the TEST static frontend
        env:
          GH_TOKEN: ${{ steps.static-reconcile.outputs.token }}
          DISPATCH_RUN_ID: ${{ github.run_id }}
        run: node scripts/dispatch-static-publish.mjs reconcile
