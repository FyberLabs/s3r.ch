name: Prepare pairing owner packages
on:
  pull_request:
    paths: [scripts/prepare-pairing-packages.mjs, .github/workflows/pairing-packages.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - run: node scripts/prepare-pairing-packages.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pairing-owner-packages
          path: pairing-prepared
          retention-days: 7
