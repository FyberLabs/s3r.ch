name: Prepare pairing owner packages
on:
  pull_request:
    paths: [scripts/prepare-pairing-packages.mjs, .github/workflows/pairing-packages.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/prepare-pairing-packages.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pairing-owner-packages
          path: pairing-prepared
          retention-days: 7
