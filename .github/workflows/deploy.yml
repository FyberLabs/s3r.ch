name: Deploy test
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-to-test
  cancel-in-progress: false
  queue: max
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
  deploy:
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: [self-hosted, linux, x64]
    environment: test
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/fyberlabs/s3r.ch
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Isolate credentials
        run: |
          mkdir -p "$RUNNER_TEMP/azure-config" "$RUNNER_TEMP/docker-config"
          echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-config" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-gh
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an already released candidate
        id: candidate
        run: node scripts/release-channels.mjs candidate
      - name: Build merge candidate
        id: build
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fyberlabs/s3r.ch:sha-${{ github.sha }}
          build-args: |
            VERSION=test-${{ github.sha }}
            SOURCE_REVISION=${{ github.sha }}
            NEXT_PUBLIC_SEED_PEER_URL=${{ vars.NEXT_PUBLIC_SEED_PEER_URL }}
            NEXT_PUBLIC_WC_PROJECT_ID=${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
      - name: Select immutable candidate
        env:
          REUSED_DIGEST: ${{ steps.candidate.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${REUSED_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Verify public package and smoke exact image
        run: |
          anonymous="$(mktemp -d)"
          trap 'rm -rf "$anonymous"' EXIT
          docker --config "$anonymous" pull "$IMAGE@$IMAGE_DIGEST"
          bash scripts/smoke-image.sh "$IMAGE@$IMAGE_DIGEST"
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.S3RCH_TEST_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy and verify test.s3r.ch
        run: bash scripts/deploy-test.sh
      - name: Publish successful test release
        run: node scripts/release-channels.mjs test
      - name: Attest the verified test deployment manifest
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tested-release-manifest.json
          github-token: ${{ github.token }}
