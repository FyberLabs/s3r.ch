name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPO: s3rch
  ACR_NAME: acrfybercg47
  ACR_LOGIN_SERVER: acrfybercg47.azurecr.io

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: [test]
    runs-on: [self-hosted, linux, x64]
    environment: prod
    env:
      ENV_TAG: prod
      AZURE_WEBAPP_NAME: s3rch-fyberlabs-prod
      AZURE_RESOURCE_GROUP: rg-s3rch-fyberlabs-prod
      HEALTH_URL: https://s3rch-fyberlabs-prod.azurewebsites.net/api/health
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR token
        id: acr
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: |
          set -euo pipefail
          : "${ACR_NAME:?Missing ACR_NAME}"
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_WC_PROJECT_ID=${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ env.ENV_TAG }}

      # Self-hosted runners share ~/.azure; a long docker build can drop the
      # first OIDC session. Re-login immediately before App Service commands.
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"; : "${SUBSCRIPTION_ID:?Missing secret AZURE_SUBSCRIPTION_ID}"
          ACR_LOGIN="${{ env.ACR_LOGIN_SERVER }}"; : "${ACR_LOGIN:?Missing ACR_LOGIN_SERVER}"
          ACTIVE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          if [ "$ACTIVE_SUBSCRIPTION_ID" != "$SUBSCRIPTION_ID" ]; then
            echo "Active Azure subscription ${ACTIVE_SUBSCRIPTION_ID} does not match AZURE_SUBSCRIPTION_ID"
            exit 1
          fi
          IMAGE="${ACR_LOGIN}/${IMAGE_REPO}:${ENV_TAG}"
          export SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME

          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE"

          echo "Refreshing Key Vault app setting references"
          az rest --method POST --uri \
            "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_WEBAPP_NAME}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --output none

          python3 - <<'PY'
import json, os, subprocess, sys, time

sub = os.environ["SUBSCRIPTION_ID"]
rg = os.environ["AZURE_RESOURCE_GROUP"]
name = os.environ["AZURE_WEBAPP_NAME"]
uri = (
    f"https://management.azure.com/subscriptions/{sub}/resourceGroups/{rg}"
    f"/providers/Microsoft.Web/sites/{name}/config/configreferences/appsettings"
    "?api-version=2022-03-01"
)
watch = "PANOPTICON_API_KEY"

def refs():
    raw = subprocess.check_output(
        ["az", "rest", "--method", "GET", "--uri", uri, "-o", "json"],
        text=True,
    )
    data = json.loads(raw)
    props = data.get("properties") or {}
    if isinstance(props, dict):
        return props
    return {}

status = ""
for attempt in range(1, 21):
    props = refs()
    meta = props.get(watch)
    if not meta:
        print(f"{watch} is not a Key Vault reference (STUN-only is valid).")
        status = "absent"
        break
    status = str(meta.get("status") or meta.get("Status") or "")
    print(f"{watch} reference status={status!r} (attempt {attempt}/20)")
    if status.lower() in {"resolved", "success"}:
        break
    time.sleep(3)
else:
    print(f"{watch} Key Vault reference did not resolve", file=sys.stderr)
    sys.exit(1)
PY

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME"

      - name: Smoke test
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$HEALTH_URL" | grep -Fq '"status":"ok"'; then
              echo "Health check passed (attempt ${attempt})"
              exit 0
            fi
            echo "Waiting for ${HEALTH_URL} (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
