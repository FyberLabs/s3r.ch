name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_REPO: s3rch
  ACR_NAME: acrfybercg47
  ACR_LOGIN_SERVER: acrfybercg47.azurecr.io

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      ENV_TAG: prod
      AZURE_WEBAPP_NAME: s3rch-fyberlabs-prod
      AZURE_RESOURCE_GROUP: rg-website-fyberlabs-prod
      HEALTH_URL: https://s3rch-fyberlabs-prod.azurewebsites.net/api/health
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Get ACR token
        id: acr
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: |
          set -euo pipefail
          : "${ACR_NAME:?Missing ACR_NAME}"
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ env.ENV_TAG }}

      - name: Deploy to App Service
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"; : "${SUBSCRIPTION_ID:?Missing secret AZURE_SUBSCRIPTION_ID}"
          ACR_LOGIN="${{ env.ACR_LOGIN_SERVER }}"; : "${ACR_LOGIN:?Missing ACR_LOGIN_SERVER}"
          az account set --subscription "$SUBSCRIPTION_ID"
          IMAGE="${ACR_LOGIN}/${IMAGE_REPO}:${ENV_TAG}"

          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE"
          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME"

      - name: Smoke test
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$HEALTH_URL" | grep -Fq '"status":"ok"'; then
              echo "Health check passed (attempt ${attempt})"
              exit 0
            fi
            echo "Waiting for ${HEALTH_URL} (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
