name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Published GHCR digest (sha256 and 64 hex). Empty builds this ref, same as a master push."
        required: false
        type: string

permissions:
  id-token: write
  contents: read
  packages: read

env:
  IMAGE_REPO: s3rch
  ACR_NAME: acrfybercg47
  ACR_LOGIN_SERVER: acrfybercg47.azurecr.io

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: [test]
    runs-on: [self-hosted, linux, x64]
    environment: prod
    env:
      ENV_TAG: prod
      AZURE_WEBAPP_NAME: s3rch-fyberlabs-prod
      AZURE_RESOURCE_GROUP: rg-s3rch-fyberlabs-prod
      HEALTH_URL: https://s3rch-fyberlabs-prod.azurewebsites.net/api/health
      # Required marketplace tenant UUID for App Service PANOPTICON_TENANT_ID.
      # Repository variable, or the same name on the prod environment.
      # Not the Azure Entra tenant. Never commit the value. An unset value
      # fails this job before checkout and does not clear the live setting.
      S3RCH_PANOPTICON_TENANT_ID: ${{ vars.S3RCH_PANOPTICON_TENANT_ID }}
    steps:
      # The value is already on the job env, so a missing variable can fail
      # before checkout and image push. UUID checks stay in
      # scripts/require-panopticon-tenant-id.sh (before the build, and again
      # before the App Service write).
      - name: Require Panopticon tenant id
        run: |
          set -euo pipefail
          tenant_id="$(printf '%s' "${S3RCH_PANOPTICON_TENANT_ID:-}" | tr -d '[:space:]')"
          if [ -z "$tenant_id" ]; then
            echo "GitHub variable S3RCH_PANOPTICON_TENANT_ID is unset." >&2
            echo "Create it as a repository variable or a prod environment variable." >&2
            echo "Refusing to update App Service so PANOPTICON_TENANT_ID is not cleared." >&2
            exit 1
          fi

      # Empty on a master push: build and push :sha and :prod, then deploy :prod.
      # A digest skips that build and deploys the published GHCR image by digest.
      - name: Choose image source
        id: published
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          digest="${IMAGE_DIGEST:-}"
          if [ -z "$digest" ]; then
            echo "use=build" >> "$GITHUB_OUTPUT"
            echo "Building from this commit."
            exit 0
          fi
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "image_digest must look like sha256:<64 hex characters>." >&2
            exit 1
          fi
          repo="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "use=digest" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "source=ghcr.io/${repo}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Deploying published image ghcr.io/${repo}@${digest}"

      # az and azure/login keep account state in ~/.azure, outside the checkout.
      # docker/login-action writes the registry token to ~/.docker/config.json.
      # The shared runners do not wipe the home directory between jobs.
      # jobs.*.env cannot read runner.temp (that context exists only in steps),
      # so this step exports both paths for every later step. RUNNER_TEMP is
      # removed when the job ends. Logout cannot clear another job's credentials.
      - name: Isolate credential stores
        run: |
          set -euo pipefail
          azure_config="$RUNNER_TEMP/azure-config"
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$azure_config" "$docker_config"
          echo "AZURE_CONFIG_DIR=$azure_config" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1

      # Full guard before image build or any App Service write. An unset or
      # non-UUID value must not reach `az webapp config appsettings set`.
      - name: Require Panopticon tenant id
        run: bash scripts/require-panopticon-tenant-id.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Require identity blob storage configuration
        run: |
          set -euo pipefail
          storage_settings="$RUNNER_TEMP/identity-blob-settings.json"
          az webapp config appsettings list \
            --resource-group rg-s3rch-fyberlabs-prod \
            --name s3rch-fyberlabs-prod \
            --query "[?name=='S3RCH_IDENTITY_BLOB_ACCOUNT' || name=='S3RCH_IDENTITY_BLOB_CONTAINER'].{name:name,value:value}" \
            -o json > "$storage_settings"
          python3 scripts/require-identity-blob-settings.py "$storage_settings"

      - name: Get ACR token
        id: acr
        env:
          ACR_NAME: ${{ env.ACR_NAME }}
        run: |
          set -euo pipefail
          : "${ACR_NAME:?Missing ACR_NAME}"
          TOKEN=$(az acr login --name "$ACR_NAME" --expose-token --output tsv --query accessToken)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: 00000000-0000-0000-0000-000000000000
          password: ${{ steps.acr.outputs.token }}

      - name: Build and push
        if: steps.published.outputs.use != 'digest'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_WC_PROJECT_ID=${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPO }}:${{ env.ENV_TAG }}

      - name: Log in to GHCR
        if: steps.published.outputs.use == 'digest'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the release image by digest and push it into ACR. App Service
      # keeps using ACR. DEPLOY_IMAGE is the digest the site is pointed at.
      - name: Mirror published image into ACR
        if: steps.published.outputs.use == 'digest'
        env:
          SOURCE: ${{ steps.published.outputs.source }}
          DIGEST: ${{ steps.published.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "$SOURCE"
          short="${DIGEST#sha256:}"
          dest_tag="${ACR_LOGIN_SERVER}/${IMAGE_REPO}:ghcr-${short:0:12}"
          image_id="$(docker image inspect --format '{{.Id}}' "$SOURCE")"
          docker tag "$image_id" "$dest_tag"
          push_log="$(docker push "$dest_tag" 2>&1)"
          printf '%s\n' "$push_log"
          pushed="$(printf '%s\n' "$push_log" | sed -n 's/.*digest: \(sha256:[0-9a-f]\{64\}\).*/\1/p' | tail -n 1)"
          if [ -z "$pushed" ]; then
            echo "ACR push did not report a digest" >&2
            exit 1
          fi
          echo "DEPLOY_IMAGE=${ACR_LOGIN_SERVER}/${IMAGE_REPO}@${pushed}" >> "$GITHUB_ENV"

      # The OIDC access token can expire during a long image build.
      # Re-login into this job's AZURE_CONFIG_DIR before App Service commands.
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Additive update of PANOPTICON_TENANT_ID only. Bases and the Key Vault
      # secret name s3rch-panopticon-api-key stay in FyberLabs/infra.
      # The require script refuses an empty or non-UUID value so this step
      # cannot blank the live setting. Uses this job's AZURE_CONFIG_DIR.
      - name: Set Panopticon tenant id
        run: |
          set -euo pipefail
          id_file="$RUNNER_TEMP/panopticon-tenant-id"
          bash scripts/require-panopticon-tenant-id.sh "$id_file"
          tenant_id="$(cat "$id_file")"
          rm -f "$id_file"
          : "${AZURE_RESOURCE_GROUP:?Missing AZURE_RESOURCE_GROUP}"
          : "${AZURE_WEBAPP_NAME:?Missing AZURE_WEBAPP_NAME}"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --settings "PANOPTICON_TENANT_ID=${tenant_id}" \
            --output none
          applied="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query "[?name=='PANOPTICON_TENANT_ID'].value | [0]" \
            --output tsv)"
          if [ "$applied" != "$tenant_id" ]; then
            echo "App Service PANOPTICON_TENANT_ID on ${AZURE_WEBAPP_NAME} does not match S3RCH_PANOPTICON_TENANT_ID."
            exit 1
          fi
          echo "App Service PANOPTICON_TENANT_ID is set on ${AZURE_WEBAPP_NAME}."

      - name: Deploy to App Service
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="${{ secrets.AZURE_SUBSCRIPTION_ID }}"; : "${SUBSCRIPTION_ID:?Missing secret AZURE_SUBSCRIPTION_ID}"
          ACR_LOGIN="${{ env.ACR_LOGIN_SERVER }}"; : "${ACR_LOGIN:?Missing ACR_LOGIN_SERVER}"
          ACTIVE_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          if [ "$ACTIVE_SUBSCRIPTION_ID" != "$SUBSCRIPTION_ID" ]; then
            echo "Active Azure subscription ${ACTIVE_SUBSCRIPTION_ID} does not match AZURE_SUBSCRIPTION_ID"
            exit 1
          fi
          if [ -n "${DEPLOY_IMAGE:-}" ]; then
            IMAGE="$DEPLOY_IMAGE"
          else
            IMAGE="${ACR_LOGIN}/${IMAGE_REPO}:${ENV_TAG}"
          fi
          echo "Container image ${IMAGE}"
          export SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME

          az webapp config container set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --container-image-name "$IMAGE"

          echo "Refreshing Key Vault app setting references"
          az rest --method POST --uri \
            "https://management.azure.com/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${AZURE_RESOURCE_GROUP}/providers/Microsoft.Web/sites/${AZURE_WEBAPP_NAME}/config/configreferences/appsettings/refresh?api-version=2022-03-01" \
            --output none

          python3 - <<'PY'
          import json, os, subprocess, sys, time

          sub = os.environ["SUBSCRIPTION_ID"]
          rg = os.environ["AZURE_RESOURCE_GROUP"]
          name = os.environ["AZURE_WEBAPP_NAME"]
          uri = (
              f"https://management.azure.com/subscriptions/{sub}/resourceGroups/{rg}"
              f"/providers/Microsoft.Web/sites/{name}/config/configreferences/appsettings"
              "?api-version=2022-03-01"
          )
          watch = "PANOPTICON_API_KEY"

          def refs():
              raw = subprocess.check_output(
                  ["az", "rest", "--method", "GET", "--uri", uri, "-o", "json"],
                  text=True,
              )
              data = json.loads(raw)
              props = data.get("properties") or {}
              if isinstance(props, dict):
                  return props
              return {}

          status = ""
          for attempt in range(1, 21):
              props = refs()
              meta = props.get(watch)
              if not meta:
                  print(f"{watch} is not a Key Vault reference (STUN-only is valid).")
                  status = "absent"
                  break
              status = str(meta.get("status") or meta.get("Status") or "")
              print(f"{watch} reference status={status!r} (attempt {attempt}/20)")
              if status.lower() in {"resolved", "success"}:
                  break
              time.sleep(3)
          else:
              print(f"{watch} Key Vault reference did not resolve", file=sys.stderr)
              sys.exit(1)
          PY

          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME"

      - name: Smoke test
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 5 --max-time 10 "$HEALTH_URL" | grep -Fq '"status":"ok"'; then
              echo "Health check passed (attempt ${attempt})"
              exit 0
            fi
            echo "Waiting for ${HEALTH_URL} (attempt ${attempt}/30)..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1

      - name: Log out of Azure and ACR
        if: always()
        env:
          AZURE_CONFIG_DIR: ${{ runner.temp }}/azure-config
          DOCKER_CONFIG: ${{ runner.temp }}/docker-config
        run: |
          set -euo pipefail
          # Only the per-job directories. Do not log out a shared ~/.azure.
          # `az logout` prints "ERROR: There are no active accounts." when
          # this job never signed in (the config dir exists after isolate).
          if [ -d "$AZURE_CONFIG_DIR" ] && az account show >/dev/null 2>&1; then
            az logout || true
          fi
          if [ -f "$DOCKER_CONFIG/config.json" ]; then
            docker logout "${ACR_LOGIN_SERVER}" || true
            docker logout ghcr.io || true
          fi
