name: Deploy test
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-to-test
  cancel-in-progress: false
  queue: max
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Fetch public synthetic device-transfer vectors
        run: node scripts/fetch-pairing-vectors.mjs
      - run: npm test
  qualify-test-candidate:
    if: github.ref == 'refs/heads/master'
    needs: test
    runs-on: [self-hosted, linux, x64]
    environment: test
    outputs:
      image_digest: ${{ steps.selected.outputs.digest }}
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ghcr.io/fyberlabs/s3r.ch
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Isolate credentials
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-gh
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an already released candidate
        id: candidate
        run: node scripts/release-channels.mjs candidate
      - name: Build merge candidate
        id: build
        if: steps.candidate.outputs.reuse != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/fyberlabs/s3r.ch:sha-${{ github.sha }}
          build-args: |
            VERSION=test-${{ github.sha }}
            SOURCE_REVISION=${{ github.sha }}
            NEXT_PUBLIC_SEED_PEER_URL=${{ vars.NEXT_PUBLIC_SEED_PEER_URL }}
            NEXT_PUBLIC_WC_PROJECT_ID=${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
      - name: Select immutable candidate
        id: selected
        env:
          REUSED_DIGEST: ${{ steps.candidate.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${REUSED_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify public package and smoke exact image
        run: |
          anonymous="$(mktemp -d)"
          trap 'rm -rf "$anonymous"' EXIT
          docker --config "$anonymous" pull "$IMAGE@$IMAGE_DIGEST"
          bash scripts/smoke-image.sh "$IMAGE@$IMAGE_DIGEST"

  deploy:
    needs: qualify-test-candidate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ needs.qualify-test-candidate.outputs.image_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/fyberlabs/s3r.ch
      IMAGE_DIGEST: ${{ needs.qualify-test-candidate.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Mint the Infra dispatch token on the hosted runner
        id: refresh-dispatch
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.S3RCH_STATIC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.S3RCH_STATIC_DISPATCH_APP_PRIVATE_KEY }}
          owner: FyberLabs
          repositories: infra
          permission-actions: write
      - name: Deploy and verify test.s3r.ch
        env:
          REFRESH_TOKEN: ${{ steps.refresh-dispatch.outputs.token }}
        run: bash scripts/deploy-test.sh

  publish:
    needs: deploy
    if: github.ref == 'refs/heads/master'
    # Public repository: a fresh hosted VM isolates the reusable key from all
    # checked-out deployment code and persistent self-hosted runner state.
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE_DIGEST: ${{ needs.deploy.outputs.image_digest }}
    steps:
      - name: Fetch independently pinned publication helper
        run: |
          gh api repos/FyberLabs/s3r.ch/contents/scripts/release-channels.mjs?ref=1b476725b096df0452ab1c2cc529579b46c95b6b --jq .content | base64 --decode > "$RUNNER_TEMP/trusted-release-channels.mjs"
          printf '%s  %s\n' 8ca0708ab96c340cd24feb2208486d4b8eda6da39e523b22bccf103e72a4da03 "$RUNNER_TEMP/trusted-release-channels.mjs" | sha256sum --check --status
      # A queued merge may differ from master's workflow files. GITHUB_TOKEN
      # cannot acquire workflows:write, which GitHub requires for that target.
      - name: Mint repository-scoped TEST publication token
        id: test-publication
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.S3RCH_TEST_PUBLICATION_APP_ID }}
          private-key: ${{ secrets.S3RCH_TEST_PUBLICATION_APP_PRIVATE_KEY }}
          owner: FyberLabs
          repositories: s3r.ch
          permission-contents: write
          permission-workflows: write
      - name: Publish successful test release
        env:
          GH_TOKEN: ${{ steps.test-publication.outputs.token }}
        run: node "$RUNNER_TEMP/trusted-release-channels.mjs" test
      - name: Attest the verified test deployment manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tested-release-manifest.json
          github-token: ${{ github.token }}

  static:
    needs: [deploy, publish]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Mint infra static dispatch token
        id: static-dispatch
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ vars.S3RCH_STATIC_DISPATCH_APP_ID }}
          private-key: ${{ secrets.S3RCH_STATIC_DISPATCH_APP_PRIVATE_KEY }}
          owner: FyberLabs
          repositories: infra
          permission-actions: write
      - name: Publish the TEST static frontend
        env:
          GH_TOKEN: ${{ steps.static-dispatch.outputs.token }}
          DISPATCH_REVISION: ${{ github.sha }}
          DISPATCH_RUN_ID: ${{ github.run_id }}
        run: node scripts/dispatch-static-publish.mjs test
